<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
    <title>Mortex AI</title>
    
    <!-- PRELOAD THEME - Runs before any CSS/JS loads -->
    <script>
      (function() {
        try {
          const accent = localStorage.getItem('accent') || '#a855f7';
          const theme = localStorage.getItem('theme') || 'dark';
          
          // Apply accent immediately
          document.documentElement.style.setProperty('--accent', accent);
          document.documentElement.style.setProperty('--accent-hover', '#6d28d9');
          
          // Apply theme
          document.documentElement.setAttribute('data-theme', theme);
          
          // Apply basic theme colors to prevent flash
          const colors = theme === 'dark' 
            ? {
                '--bg-app': '#111117',
                '--bg-surface': '#1a1a24',
                '--text-primary': '#f0eeff',
                '--text-secondary': '#9ca3af',
                '--border-default': 'rgba(255,255,255,0.08)',
              }
            : {
                '--bg-app': '#f7f7fb',
                '--bg-surface': '#ffffff',
                '--text-primary': '#16161d',
                '--text-secondary': '#52525b',
                '--border-default': 'rgba(0,0,0,0.1)',
              };
          
          Object.entries(colors).forEach(([key, value]) => {
            document.documentElement.style.setProperty(key, value);
          });
        } catch (e) {
          // Fallback to defaults
          document.documentElement.style.setProperty('--accent', '#a855f7');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
   <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
